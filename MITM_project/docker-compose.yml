services:
  tool-server:
    build: ./tool_server
    container_name: tool-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./certs:/certs
    command: >
      uvicorn tool_server:app
      --host 0.0.0.0
      --port 8000
      --ssl-keyfile /certs/server.key
      --ssl-certfile /certs/server.crt

  agent_b:
    build: ./agent_b
    container_name: agent_b
    ports:
      - "8001:8001"
    depends_on:
      - tool-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent_b/agent_b.py:/app/agent_b.py
      # [핵심] MITM_project 폴더의 burp.crt를 코드에서 지정한 경로로 마운트
      - ./burp.crt:/usr/local/share/ca-certificates/burp.crt

  agent_a:
    build: ./agent_a
    container_name: agent_a
    depends_on:
      - agent_b
    tty: true
    stdin_open: true